<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b0d"/><stop offset=".58" stop-color="#0a1118"/><stop offset="1" stop-color="#15120b"/></linearGradient><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#19252d"/></pattern></defs><rect width="1600" height="560" rx="28" fill="url(#bg)"/><rect width="1600" height="560" rx="28" fill="url(#grid)" opacity=".25"/><rect x="1" y="1" width="1598" height="558" rx="27" fill="none" stroke="#31404d"/><text x="44" y="50" fill="#f2c037" font-family="monospace" font-size="15">› S.T.A.L.K.E.R.-Save-Editor / showcase</text><text x="44" y="112" fill="#f2c037" font-family="Arial" font-size="31" font-weight="800">S.T.A.L.K.E.R.</text><text x="44" y="174" fill="#f4f5f7" font-family="Arial" font-size="66" font-weight="800">Save Editor</text><text x="44" y="214" fill="#b8c3cc" font-family="Arial" font-size="21">One C# core for seven save formats.</text><text x="44" y="248" fill="#8e9ba7" font-family="Arial" font-size="17">Desktop · browser · CLI · Steam boundary · in-game companion · doctors · guarded game fixes.</text><rect x="44" y="284" width="830" height="102" rx="15" fill="#0b1219" stroke="#31404d"/><text x="65" y="314" fill="#f2c037" font-family="monospace" font-size="10">EDITING RULE</text><text x="65" y="350" fill="#f4f5f7" font-family="Arial" font-size="28" font-weight="800">If a structure cannot be rewritten safely, it stays read-only.</text><text x="65" y="374" fill="#8e9ba7" font-family="Arial" font-size="11">Capability gates, backups, fresh hashes and post-write verification protect every writable path.</text><g transform="translate(44 420)"><rect width="160" height="38" rx="8" fill="#0b151c" stroke="#31404d"/><text x="80" y="24" text-anchor="middle" fill="#f2c037" font-family="monospace" font-size="10">C# / .NET 10</text></g><g transform="translate(218 420)"><rect width="160" height="38" rx="8" fill="#0b151c" stroke="#31404d"/><text x="80" y="24" text-anchor="middle" fill="#f4f5f7" font-family="monospace" font-size="10">Avalonia 11</text></g><g transform="translate(392 420)"><rect width="160" height="38" rx="8" fill="#0b151c" stroke="#31404d"/><text x="80" y="24" text-anchor="middle" fill="#4cc9ff" font-family="monospace" font-size="10">WASM</text></g><g transform="translate(566 420)"><rect width="160" height="38" rx="8" fill="#0b151c" stroke="#31404d"/><text x="80" y="24" text-anchor="middle" fill="#f4f5f7" font-family="monospace" font-size="10">NativeAOT</text></g><g transform="translate(740 420)"><rect width="160" height="38" rx="8" fill="#0b151c" stroke="#31404d"/><text x="80" y="24" text-anchor="middle" fill="#f4f5f7" font-family="monospace" font-size="10">Lua 5.1</text></g><g transform="translate(914 420)"><rect width="160" height="38" rx="8" fill="#0b151c" stroke="#31404d"/><text x="80" y="24" text-anchor="middle" fill="#f4f5f7" font-family="monospace" font-size="10">Win · Linux · macOS</text></g>
