<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="455" viewBox="0 0 1600 455"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b0d"/><stop offset=".58" stop-color="#0a1118"/><stop offset="1" stop-color="#15120b"/></linearGradient><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#19252d"/></pattern></defs><rect width="1600" height="455" rx="28" fill="url(#bg)"/><rect width="1600" height="455" rx="28" fill="url(#grid)" opacity=".25"/><rect x="1" y="1" width="1598" height="453" rx="27" fill="none" stroke="#31404d"/><text x="36" y="44" fill="#f2c037" font-family="monospace" font-size="15">› core_model</text><text x="260" y="44" fill="#8e9ba7" font-family="Arial" font-size="12">Format detection and capabilities decide what the UI is allowed to write.</text>
<g transform="translate(40 85)"><rect width="220" height="76" rx="13" fill="#0a151d" stroke="#f2c037" stroke-opacity=".65"/><text x="110" y="30" text-anchor="middle" fill="#f2c037" font-family="monospace" font-size="9">SOURCE SAVE</text><text x="110" y="54" text-anchor="middle" fill="#ccd4da" font-family="Arial" font-size="10.5">opaque bytes</text></g><g transform="translate(300 85)"><rect width="220" height="76" rx="13" fill="#0a151d" stroke="#4cc9ff" stroke-opacity=".65"/><text x="110" y="30" text-anchor="middle" fill="#4cc9ff" font-family="monospace" font-size="9">FORMAT REGISTRY</text><text x="110" y="54" text-anchor="middle" fill="#ccd4da" font-family="Arial" font-size="10.5">7 supported formats</text></g><g transform="translate(560 85)"><rect width="220" height="76" rx="13" fill="#0a151d" stroke="#66df91" stroke-opacity=".65"/><text x="110" y="30" text-anchor="middle" fill="#66df91" font-family="monospace" font-size="9">PARSER</text><text x="110" y="54" text-anchor="middle" fill="#ccd4da" font-family="Arial" font-size="10.5">known + opaque fields</text></g><g transform="translate(820 85)"><rect width="220" height="76" rx="13" fill="#0a151d" stroke="#f2c037" stroke-opacity=".65"/><text x="110" y="30" text-anchor="middle" fill="#f2c037" font-family="monospace" font-size="9">CAPABILITIES</text><text x="110" y="54" text-anchor="middle" fill="#ccd4da" font-family="Arial" font-size="10.5">read / write gates</text></g><g transform="translate(1080 85)"><rect width="220" height="76" rx="13" fill="#0a151d" stroke="#ff914d" stroke-opacity=".65"/><text x="110" y="30" text-anchor="middle" fill="#ff914d" font-family="monospace" font-size="9">EDIT PLAN</text><text x="110" y="54" text-anchor="middle" fill="#ccd4da" font-family="Arial" font-size="10.5">immutable change set</text></g><g transform="translate(1340 85)"><rect width="220" height="76" rx="13" fill="#0a151d" stroke="#66df91" stroke-opacity=".65"/><text x="110" y="30" text-anchor="middle" fill="#66df91" font-family="monospace" font-size="9">VERIFIER</text><text x="110" y="54" text-anchor="middle" fill="#ccd4da" font-family="Arial" font-size="10.5">round-trip checks</text></g><path d="M260 123H300 M520 123H560 M780 123H820 M1040 123H1080 M1300 123H1340" stroke="#51616b" stroke-width="2"/>
<g transform="translate(40 230)"><rect width="470" height="140" rx="15" fill="#0b1219" stroke="#31404d"/><rect width="4" height="140" rx="2" fill="#4cc9ff"/><text x="18" y="25" fill="#4cc9ff" font-family="monospace" font-size="9">UNKNOWN FIELDS</text><text x="18" y="51" fill="#f4f5f7" font-family="Arial" font-size="15" font-weight="700">Opaque or read-only</text><text x="18" y="76" fill="#8e9ba7" font-family="Arial" font-size="10.5">the editor preserves bytes it cannot prove it understands</text></g><g transform="translate(535 230)"><rect width="470" height="140" rx="15" fill="#0b1219" stroke="#31404d"/><rect width="4" height="140" rx="2" fill="#f2c037"/><text x="18" y="25" fill="#f2c037" font-family="monospace" font-size="9">WRITE ACCESS</text><text x="18" y="51" fill="#f4f5f7" font-family="Arial" font-size="15" font-weight="700">Evidence-gated</text><text x="18" y="76" fill="#8e9ba7" font-family="Arial" font-size="10.5">unsupported targets remain visible but non-writable</text></g><g transform="translate(1030 230)"><rect width="490" height="140" rx="15" fill="#0b1219" stroke="#31404d"/><rect width="4" height="140" rx="2" fill="#66df91"/><text x="18" y="25" fill="#66df91" font-family="monospace" font-size="9">SAME CORE</text><text x="18" y="51" fill="#f4f5f7" font-family="Arial" font-size="15" font-weight="700">Desktop · browser · CLI</text><text x="18" y="76" fill="#8e9ba7" font-family="Arial" font-size="10.5">UI and automation reuse the same format/editing logic</text></g></svg>